<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="점심 도시락 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3DE"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 반짝이 -->
  <circle cx="404" cy="104" r="14" fill="#FFF7DA" opacity="0.9"/>
  <circle cx="96" cy="132" r="9" fill="#FFF7DA" opacity="0.75"/>
  <circle cx="428" cy="352" r="8" fill="#FFF7DA" opacity="0.7"/>

  <!-- 도시락 몸통 -->
  <rect x="82" y="176" width="348" height="216" rx="44" fill="url(#box)" stroke="#E4590B" stroke-width="10"/>
  <rect x="82" y="176" width="348" height="54" rx="27" fill="#FFD9B0"/>
  <rect x="82" y="203" width="348" height="27" fill="#FFD9B0"/>

  <!-- 칸막이 -->
  <line x1="256" y1="230" x2="256" y2="392" stroke="#E4590B" stroke-width="8" stroke-linecap="round"/>
  <line x1="82" y1="318" x2="256" y2="318" stroke="#E4590B" stroke-width="8" stroke-linecap="round"/>

  <!-- 밥 -->
  <ellipse cx="168" cy="286" rx="56" ry="40" fill="#FFFCF3" stroke="#E8D5B5" stroke-width="6"/>
  <circle cx="150" cy="278" r="6" fill="#F3E4C8"/>
  <circle cx="178" cy="292" r="5" fill="#F3E4C8"/>
  <circle cx="188" cy="270" r="4" fill="#F3E4C8"/>

  <!-- 반찬 (초록) -->
  <circle cx="204" cy="356" r="30" fill="#5FBF7E"/>
  <circle cx="204" cy="356" r="18" fill="#8FD9A5"/>

  <!-- 반찬 (빨강) -->
  <circle cx="330" cy="286" r="42" fill="#EF5B45"/>
  <circle cx="330" cy="286" r="26" fill="#FF8A73"/>
  <circle cx="318" cy="272" r="7" fill="#FFD3C9"/>

  <!-- 달걀 노른자 -->
  <circle cx="356" cy="356" r="30" fill="#FFE27A"/>
  <circle cx="356" cy="356" r="15" fill="#F7B733"/>

  <!-- 젓가락 -->
  <line x1="300" y1="96" x2="380" y2="176" stroke="#7A3E0B" stroke-width="13" stroke-linecap="round"/>
  <line x1="264" y1="112" x2="336" y2="184" stroke="#7A3E0B" stroke-width="13" stroke-linecap="round"/>
  <line x1="330" y1="128" x2="352" y2="150" stroke="#7A3E0B" stroke-width="13" stroke-linecap="round"/>
</svg>
