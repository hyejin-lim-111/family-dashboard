<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미리보기 프레임</title>
<style>
  html, body { margin: 0; padding: 0; background: #F3F0EA; }
  body { display: flex; align-items: flex-start; justify-content: center; }
  iframe { border: 0; width: 1080px; height: 980px; background: #FFF8F0; display: block; }
</style>
</head>
<body>
<iframe id="frame" src="index.html" title="우리 가족 기록장 미리보기"></iframe>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var f = document.getElementById("frame");
    if (q.get("w")) f.style.width = parseInt(q.get("w"), 10) + "px";
    if (q.get("h")) f.style.height = parseInt(q.get("h"), 10) + "px";
  })();
</script>
</body>
</html>
