<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<meta name="description" content="다인이와 엄마, 아빠가 함께 쓰는 따뜻한 가족 기록장 — 가족 달력, 함께 체크리스트, 오늘의 공부, 도장판, 내 캐릭터 키우기, 가족 미션, 할 일, 채팅.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 본문 글씨: Pretendard (깨끗한 고딕) + Noto Sans KR 폴백 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=20261117">
</head>
<body>

<!-- 새 채팅 알림 배너 (다른 가족이 보낸 메시지·사진) -->
<button class="chat-banner" id="chatBanner" type="button" data-action="open-chat" hidden aria-live="polite">
  <span class="cb-ico" aria-hidden="true">💬</span>
  <span class="cb-txt" id="chatBannerText"></span>
  <span class="cb-go">보기</span>
</button>

<!-- 기기 프로필 선택 (처음 켤 때 / 잠금 해제 시) -->
<div class="gate" id="deviceGate" hidden>
  <div class="gate-inner">
    <img class="gate-mark" src="assets/avatar_daini.png" alt="">
    <h1 class="gate-title">우리 가족 기록장</h1>
    <p class="gate-sub">이 기기는 누구 것이에요?</p>
    <div class="gate-list" id="gateList"></div>
    <p class="gate-note">한 번 고르면 이 기기에 기억해 두고,<br>설정에서 언제든 바꿀 수 있어요.</p>
  </div>
</div>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="assets/avatar_daini.png" alt="우리 가족 기록장">
      <div>
        <p class="brand-title">우리 가족 기록장</p>
        <p class="brand-sub" id="todayLabel">오늘</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="device-chip" type="button" data-action="open-device" id="deviceChip" aria-label="이 기기 프로필 바꾸기">
        <img id="deviceChipImg" src="assets/avatar_daini.png" alt="">
        <span id="deviceChipName">다인이</span>
      </button>
      <button class="icon-btn" type="button" data-action="toggle-lock" id="lockBtn" aria-label="이 기기 잠금" title="이 기기 잠금">🔓</button>
      <button class="icon-btn" type="button" data-action="open-settings" id="settingsBtn" aria-label="설정" title="설정">⚙️</button>
    </div>
  </header>

  <main class="views" id="views">

    <!-- 홈 -->
    <section class="view is-active" id="view-home" data-view="home" aria-label="홈">
      <div class="stack" id="homeContent"></div>
    </section>

    <!-- 공부 / 루틴 -->
    <section class="view" id="view-study" data-view="study" aria-label="공부와 루틴">
      <div class="stack" id="studyContent"></div>
    </section>

    <!-- 🐣 내 캐릭터 키우기 (레벨업 + 돌보기) -->
    <section class="view" id="view-pet" data-view="pet" aria-label="내 캐릭터 키우기">
      <div class="stack" id="petContent"></div>
    </section>

    <!-- 미션 / 할 일 -->
    <section class="view" id="view-mission" data-view="mission" aria-label="가족 미션과 오늘 할 일">
      <div class="stack" id="missionContent"></div>
    </section>

    <!-- 함께: 가족 달력 + 함께 체크리스트 -->
    <section class="view" id="view-together" data-view="together" aria-label="가족 달력과 함께 체크리스트">
      <div class="stack">
        <div class="seg" id="togetherSeg" role="tablist" aria-label="함께 보기">
          <button class="seg-btn is-active" type="button" role="tab" data-action="together-sub" data-sub="calendar" aria-selected="true">📅 가족 달력</button>
          <button class="seg-btn" type="button" role="tab" data-action="together-sub" data-sub="checklist" aria-selected="false">✅ 함께 체크리스트</button>
        </div>
        <div class="stack" id="togetherContent"></div>
      </div>
    </section>

    <!-- 성장 (키·몸무게 성장도표) -->
    <section class="view" id="view-growth" data-view="growth" aria-label="다인이 성장 기록">
      <div class="stack" id="growthContent"></div>
    </section>

    <!-- 채팅 -->
    <section class="view" id="view-chat" data-view="chat" aria-label="우리 가족 채팅">
      <div class="stack chat-shell">
        <div class="card chat-card">
          <div class="chat-list" id="chatList" aria-live="polite"></div>
          <div class="chat-composer" id="chatComposer">
            <div class="quick-panel" id="quickPanel">
              <div class="quick-head">
                <span class="quick-title">🎀 다인이 말판</span>
                <span class="quick-note">한 번만 누르면 바로 보내져요</span>
                <button class="btn btn-xs btn-ghost quick-tool" type="button" data-action="quick-add" id="quickAddBtn" aria-label="말판 문구 추가" title="말판 문구 추가">+ 추가</button>
                <button class="btn btn-xs btn-ghost quick-tool" type="button" data-action="quick-edit" id="quickEditBtn" aria-pressed="false" title="말판 직접 편집">편집</button>
                <button class="btn btn-xs btn-ghost" type="button" data-action="toggle-quick" id="quickToggle" aria-expanded="true">접기</button>
              </div>
              <div class="quick-edit-bar" id="quickEditBar" hidden>
                <span class="quick-edit-hint">✕ 를 눌러 지우고 <b>+ 추가</b> 로 더해요</span>
                <button class="btn btn-xs btn-ghost" type="button" data-action="quick-reset">기본값으로</button>
              </div>
              <div class="quick-grid" id="quickGrid"></div>
            </div>
            <div class="sticker-sheet" id="stickerSheet" hidden></div>
            <div class="rec-bar" id="recBar" hidden>
              <span class="rec-dot"></span>
              <span class="grow">녹음 중… <b id="recTime">0:00</b></span>
              <button class="btn btn-xs btn-ghost" type="button" data-action="cancel-voice">취소</button>
              <button class="btn btn-xs btn-primary" type="button" data-action="stop-voice">보내기</button>
            </div>
            <form class="composer-row" id="chatForm" autocomplete="off">
              <button class="icon-btn" type="button" data-action="toggle-stickers" aria-label="스티커" title="스티커">🎀</button>
              <button class="icon-btn photo-btn" type="button" data-action="pick-photo" aria-label="사진 찍어 올리기" title="사진 올리기">📷</button>
              <input class="hidden-file" id="chatPhotoInput" type="file" accept="image/*" aria-label="사진 고르기">
              <input class="text-input" id="chatInput" type="text" placeholder="따뜻한 한마디 남겨요" aria-label="메시지" maxlength="300">
              <button class="icon-btn mic-btn" type="button" data-action="start-voice" id="micBtn" aria-label="음성 메모" title="음성 메모">🎙️</button>
              <button class="send-btn" type="submit" aria-label="보내기">➤</button>
            </form>
          </div>
        </div>
        <p class="muted center" style="font-size:11.5px">가족 모두에게 보이는 이야기예요. 서로 다정하게 남겨요 💗</p>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="주요 메뉴">
    <button class="tab-btn is-active" type="button" role="tab" data-action="tab" data-tab="home" aria-selected="true">
      <span class="tab-ico">🏡</span><span>홈</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="study" aria-selected="false">
      <span class="tab-ico">📖</span><span>공부</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="pet" aria-selected="false">
      <span class="tab-ico">🐣</span><span>키우기</span>
      <span class="tab-badge" id="petBadge" hidden>!</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="mission" aria-selected="false">
      <span class="tab-ico">🌈</span><span>미션</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="together" aria-selected="false" aria-label="가족 달력과 함께 체크리스트">
      <span class="tab-ico">🗓️</span><span>함께</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="growth" aria-selected="false">
      <span class="tab-ico">📏</span><span>성장</span>
    </button>
    <button class="tab-btn" type="button" role="tab" data-action="tab" data-tab="chat" aria-selected="false">
      <span class="tab-ico">💬</span><span>채팅</span>
      <span class="tab-badge" id="chatBadge" hidden>0</span>
    </button>
  </nav>

</div>

<!-- 태블릿 끄기 알람 (타이머가 00:00 이 되면 화면 전체를 덮어요) -->
<div class="alarm-overlay" id="alarmOverlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle" aria-describedby="alarmMsg">
  <div class="alarm-box">
    <div class="alarm-emoji" aria-hidden="true">⏰</div>
    <h2 class="alarm-title" id="alarmTitle">시간이 다 됐어요!</h2>
    <p class="alarm-msg" id="alarmMsg">이제 태블릿을 꺼 주세요!</p>
    <p class="alarm-note">잘 했어요 — 내일 또 만나요 🌙</p>
    <button class="btn btn-primary btn-block alarm-btn" type="button" data-action="dismiss-alarm" id="alarmOkBtn">확인했어요</button>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="growth-data.js"></script>
<script src="store.js?v=20261117"></script>
<script src="app.js?v=20261117"></script>
</body>
</html>
